<style>
  .db-sec { font-size: .7rem; color: var(--text-main); }
  .db-exp-imp-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: .6rem;
  }
  @media (max-width: 576px) { .db-exp-imp-row { grid-template-columns: 1fr; } }

  .db-card {
    background: var(--bg-footer); border: 1px solid rgba(0,0,0,.04);
    border-radius: 7px; padding: .5rem .65rem;
    display: flex; flex-direction: column; gap: .3rem;
  }
  .db-card-head {
    display: flex; align-items: center; gap: .4rem;
  }
  .db-card-icon {
    width: 28px; height: 28px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .8rem; flex-shrink: 0;
  }
  .db-card-icon-olive { background: var(--olive-100); color: var(--olive-700); }
  .db-card-icon-blue  { background: rgba(13,110,253,.08); color: #0d6efd; }
  .db-card-title { font-size: .68rem; font-weight: 700; color: var(--text-main); }
  .db-card-desc  { font-size: .58rem; color: var(--text-muted); line-height: 1.3; }

  .db-btn {
    font-size: .62rem; font-weight: 600;
    padding: .22rem .5rem; border-radius: 5px;
    display: inline-flex; align-items: center; gap: .25rem;
    border: none; cursor: pointer;
    align-self: flex-start;
  }
  .db-btn-olive {
    background: var(--olive-700); border: 1px solid var(--olive-700); color: #fff;
  }
  .db-btn-olive:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }

  .db-file-input {
    font-size: .6rem; padding: .2rem .45rem; border-radius: 5px;
    border: 1px solid var(--border);
  }

  .db-warn {
    padding: .22rem .45rem; border-radius: 4px;
    font-size: .56rem; background: rgba(185,28,28,.04);
    border: 1px solid rgba(185,28,28,.1); color: var(--danger);
  }
</style>

{% set wip_mode = 'card' %}
{% set wip_text = 'Módulo de relatórios avançados chegando em breve.' %}
{% include 'components/wip.html' %}
