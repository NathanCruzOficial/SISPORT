<style>
  .sec-section { font-size: .72rem; color: var(--text-main); }
  .sec-section .text-muted { color: var(--text-muted) !important; font-size: .65rem; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
  }
  .sec-head-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--olive-100);
    color: var(--olive-700);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .sec-head-title {
    font-size: .74rem;
    font-weight: 700;
    color: var(--text-main);
  }
  .sec-head-sub {
    font-size: .6rem;
    color: var(--text-muted);
  }

  .sec-field {
    margin-bottom: .55rem;
  }
  .sec-label {
    display: block;
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: .15rem;
  }
  .sec-input {
    width: 100%;
    max-width: 200px;
    font-size: .7rem;
    padding: .3rem .5rem;
    border: 1px solid var(--border, rgba(0,0,0,.12));
    border-radius: 6px;
    background: var(--bg-card, #fff);
    color: var(--text-main);
  }
  .sec-input:focus {
    outline: none;
    border-color: var(--olive-700);
    box-shadow: 0 0 0 2px rgba(74,93,35,.1);
  }
  .sec-hint {
    font-size: .58rem;
    color: var(--text-muted);
    margin-top: .15rem;
  }

  .vis-btn-primary {
    background: var(--olive-700);
    border-color: var(--olive-700);
    color: #fff;
    font-size: .66rem;
    font-weight: 600;
    padding: .28rem .65rem;
    border-radius: 6px;
  }
  .vis-btn-primary:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }
</style>

<div class="sec-section">
  <form method="post" action="{{ url_for('settings.save_tab', tab_key='general') }}">
    {# Reaproveita a mesma rota de save, os campos são cumulativos #}
    <input type="hidden" name="inst_name" value="{{ settings.general.institution.name }}">
    <input type="hidden" name="inst_short_name" value="{{ settings.general.institution.short_name }}">
    <input type="hidden" name="header_line_1" value="{{ settings.general.institution.header_line_1 }}">
    <input type="hidden" name="header_line_2" value="{{ settings.general.institution.header_line_2 }}">

    <div class="sec-head">
      <span class="sec-head-icon"><i class="bi bi-layout-text-window"></i></span>
      <div class="flex-fill">
        <div class="sec-head-title">Aparência e Exibição</div>
        <div class="sec-head-sub">Configure como os dados são exibidos nas listagens.</div>
      </div>
    </div>

    <div class="sec-field">
      <label class="sec-label">Registros por página</label>
      <input type="number" name="records_per_page" class="sec-input" min="10" max="200"
             value="{{ settings.general.appearance.records_per_page }}">
      <div class="sec-hint">Quantidade padrão de resultados em listagens.</div>
    </div>

    <div class="mt-2 text-end">
      <button type="submit" class="btn vis-btn-primary">
        <i class="bi bi-check-lg me-1"></i>Salvar
      </button>
    </div>
  </form>
</div>
