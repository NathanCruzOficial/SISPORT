<style>
  .sec-section { font-size: .72rem; color: var(--text-main); }
  .sec-section .text-muted { color: var(--text-muted) !important; font-size: .65rem; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
  }
  .sec-head-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--olive-100);
    color: var(--olive-700);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .sec-head-title {
    font-size: .74rem;
    font-weight: 700;
    color: var(--text-main);
  }
  .sec-head-sub {
    font-size: .6rem;
    color: var(--text-muted);
  }

  .sec-field {
    margin-bottom: .55rem;
  }
  .sec-label {
    display: block;
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: .15rem;
  }
  .sec-input {
    width: 100%;
    max-width: 200px;
    font-size: .7rem;
    padding: .3rem .5rem;
    border: 1px solid var(--border, rgba(0,0,0,.12));
    border-radius: 6px;
    background: var(--bg-card, #fff);
    color: var(--text-main);
  }
  .sec-input:focus {
    outline: none;
    border-color: var(--olive-700);
    box-shadow: 0 0 0 2px rgba(74,93,35,.1);
  }
  .sec-hint {
    font-size: .58rem;
    color: var(--text-muted);
    margin-top: .15rem;
  }

  .sec-check-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .6rem;
    background: var(--bg-footer);
    border: 1px solid rgba(0,0,0,.04);
    border-radius: 6px;
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .sec-check-item:hover {
    border-color: rgba(74,93,35,.15);
    background: var(--olive-100);
  }
  .sec-check-item .form-check-input {
    width: 1rem;
    height: 1rem;
    margin: 0;
    cursor: pointer;
  }
  .sec-check-item .form-check-input:checked {
    background-color: var(--olive-700);
    border-color: var(--olive-700);
  }
  .sec-check-label {
    font-size: .7rem;
    font-weight: 500;
    color: var(--text-main);
    flex: 1;
  }
  .sec-check-tag {
    font-size: .55rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(74,93,35,.08);
    color: var(--olive-700);
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .vis-btn-primary {
    background: var(--olive-700);
    border-color: var(--olive-700);
    color: #fff;
    font-size: .66rem;
    font-weight: 600;
    padding: .28rem .65rem;
    border-radius: 6px;
  }
  .vis-btn-primary:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }
</style>

<div class="sec-section">
  <form method="post" action="{{ url_for('settings.save_tab', tab_key='security') }}">
    <div class="sec-head">
      <span class="sec-head-icon"><i class="bi bi-clock-history"></i></span>
      <div class="flex-fill">
        <div class="sec-head-title">Sessão e Segurança</div>
        <div class="sec-head-sub">Configure timeout e proteções de ações críticas.</div>
      </div>
    </div>

    <div class="sec-field">
      <label class="sec-label">Timeout de Sessão (minutos)</label>
      <input type="number" name="timeout_minutes" class="sec-input" min="5" max="480"
             value="{{ settings.security.session.timeout_minutes }}">
      <div class="sec-hint">Tempo de inatividade antes de exigir nova autenticação.</div>
    </div>

    <label class="sec-check-item">
      <input type="checkbox" name="require_password_for_delete" class="form-check-input"
             {{ 'checked' if settings.security.session.require_password_for_delete }}>
      <span class="sec-check-label">Exigir senha de administrador para excluir visitantes</span>
      <span class="sec-check-tag">delete</span>
    </label>

    <div class="mt-2 text-end">
      <button type="submit" class="btn vis-btn-primary">
        <i class="bi bi-check-lg me-1"></i>Salvar
      </button>
    </div>
  </form>
</div>
