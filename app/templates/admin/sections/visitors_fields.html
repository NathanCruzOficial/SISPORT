<style>
  .vis-section { font-size: .72rem; color: var(--text-main); }
  .vis-section .text-muted { color: var(--text-muted) !important; font-size: .65rem; }

  .vis-fields-list {
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .vis-field-item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .6rem;
    background: var(--bg-footer);
    border: 1px solid rgba(0,0,0,.04);
    border-radius: 6px;
    transition: border-color .15s, background .15s;
  }
  .vis-field-item:hover {
    border-color: rgba(74,93,35,.15);
    background: var(--olive-100);
  }
  .vis-field-item .form-check-input {
    width: 1rem;
    height: 1rem;
    margin: 0;
    cursor: pointer;
  }
  .vis-field-item .form-check-input:checked {
    background-color: var(--olive-700);
    border-color: var(--olive-700);
  }
  .vis-field-label {
    font-size: .7rem;
    font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    flex: 1;
  }
  .vis-field-tag {
    font-size: .55rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(74,93,35,.08);
    color: var(--olive-700);
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .vis-btn-primary {
    background: var(--olive-700);
    border-color: var(--olive-700);
    color: #fff;
    font-size: .66rem;
    font-weight: 600;
    padding: .28rem .65rem;
    border-radius: 6px;
  }
  .vis-btn-primary:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }
</style>

<div class="vis-section">
  <form method="post" action="{{ url_for('admin.save_visitors') }}">
    <input type="hidden" name="categories_list"
           value="{{ settings.visitor_categories_raw | default('') }}">

    <div class="text-muted mb-2">
      Defina quais campos são obrigatórios no cadastro de visitantes.
    </div>

    <div class="vis-fields-list">
      <label class="vis-field-item">
        <input type="checkbox" name="father_name_required" class="form-check-input"
               {{ 'checked' if settings.visitor_father_name_required }}>
        <span class="vis-field-label">Nome do Pai</span>
        <span class="vis-field-tag">father_name</span>
      </label>

      <label class="vis-field-item">
        <input type="checkbox" name="email_required" class="form-check-input"
               {{ 'checked' if settings.visitor_email_required }}>
        <span class="vis-field-label">E-mail</span>
        <span class="vis-field-tag">email</span>
      </label>

      <label class="vis-field-item">
        <input type="checkbox" name="empresa_required" class="form-check-input"
               {{ 'checked' if settings.visitor_empresa_required }}>
        <span class="vis-field-label">Empresa</span>
        <span class="vis-field-tag">empresa</span>
      </label>

      <label class="vis-field-item">
        <input type="checkbox" name="visit_reason_required" class="form-check-input"
               {{ 'checked' if settings.visitor_visit_reason_required }}>
        <span class="vis-field-label">Motivo da Visitação</span>
        <span class="vis-field-tag">visit_reason</span>
      </label>
    </div>

    <div class="mt-2 text-end">
      <button type="submit" class="btn vis-btn-primary">
        <i class="bi bi-check-lg me-1"></i>Salvar
      </button>
    </div>
  </form>
</div>
