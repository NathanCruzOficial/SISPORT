<style>
  .sec-section { font-size: .72rem; color: var(--text-main); }
  .sec-section .text-muted { color: var(--text-muted) !important; font-size: .65rem; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
  }
  .sec-head-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--olive-100);
    color: var(--olive-700);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .sec-head-title {
    font-size: .74rem;
    font-weight: 700;
    color: var(--text-main);
  }
  .sec-head-sub {
    font-size: .6rem;
    color: var(--text-muted);
  }

  .sec-field {
    margin-bottom: .55rem;
  }
  .sec-label {
    display: block;
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: .15rem;
  }
  .sec-input {
    width: 100%;
    font-size: .7rem;
    padding: .3rem .5rem;
    border: 1px solid var(--border, rgba(0,0,0,.12));
    border-radius: 6px;
    background: var(--bg-card, #fff);
    color: var(--text-main);
  }
  .sec-input:focus {
    outline: none;
    border-color: var(--olive-700);
    box-shadow: 0 0 0 2px rgba(74,93,35,.1);
  }

  .sec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: .5rem;
  }

  .sec-alert {
    padding: .4rem .6rem;
    border-radius: 6px;
    font-size: .62rem;
    margin-top: .5rem;
    display: flex;
    align-items: flex-start;
    gap: .4rem;
  }
  .sec-alert i { font-size: .75rem; flex-shrink: 0; margin-top: 1px; }
  .sec-alert-warn {
    background: rgba(180,83,9,.06);
    border: 1px solid rgba(180,83,9,.15);
    color: #6B5B45;
  }
  .sec-alert-info {
    background: rgba(13,110,253,.05);
    border: 1px solid rgba(13,110,253,.12);
    color: #4A6B8A;
  }

  .vis-btn-warning {
    background: #D4A017;
    border-color: #D4A017;
    color: #fff;
    font-size: .66rem;
    font-weight: 600;
    padding: .28rem .65rem;
    border-radius: 6px;
  }
  .vis-btn-warning:hover { background: #B8860B; border-color: #B8860B; color: #fff; }
</style>

{% set wip_mode = 'card' %}
{% set wip_text = 'Sistema de autenticação avançada chegando em breve.' %}
{% include 'components/wip.html' %}
