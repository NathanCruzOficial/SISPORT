<style>
  .sec-section { font-size: .72rem; color: var(--text-main); }
  .sec-section .text-muted { color: var(--text-muted) !important; font-size: .65rem; }

  .sec-head {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .6rem;
  }
  .sec-head-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--olive-100);
    color: var(--olive-700);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: .9rem;
    flex-shrink: 0;
  }
  .sec-head-title {
    font-size: .74rem;
    font-weight: 700;
    color: var(--text-main);
  }
  .sec-head-sub {
    font-size: .6rem;
    color: var(--text-muted);
  }

  .sec-field {
    margin-bottom: .55rem;
  }
  .sec-label {
    display: block;
    font-size: .65rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: .15rem;
  }
  .sec-input {
    width: 100%;
    font-size: .7rem;
    padding: .3rem .5rem;
    border: 1px solid var(--border, rgba(0,0,0,.12));
    border-radius: 6px;
    background: var(--bg-card, #fff);
    color: var(--text-main);
  }
  .sec-input:focus {
    outline: none;
    border-color: var(--olive-700);
    box-shadow: 0 0 0 2px rgba(74,93,35,.1);
  }

  .sec-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: .5rem;
  }
  .sec-grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: .5rem;
  }

  .vis-btn-primary {
    background: var(--olive-700);
    border-color: var(--olive-700);
    color: #fff;
    font-size: .66rem;
    font-weight: 600;
    padding: .28rem .65rem;
    border-radius: 6px;
  }
  .vis-btn-primary:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }
</style>

<div class="sec-section">
  <form method="post" action="{{ url_for('admin.save_general') }}">
    <div class="sec-head">
      <span class="sec-head-icon"><i class="bi bi-bank"></i></span>
      <div class="flex-fill">
        <div class="sec-head-title">Dados da Instituição</div>
        <div class="sec-head-sub">Informações exibidas em relatórios e cabeçalhos.</div>
      </div>
    </div>

    <div class="sec-grid">
      <div class="sec-field">
        <label class="sec-label">Nome completo da Instituição</label>
        <input type="text" name="inst_name" class="sec-input"
               value="{{ settings.inst_name }}">
      </div>
    </div>

    <div class="sec-grid-2">
      <div class="sec-field">
        <label class="sec-label">Nome Abreviado</label>
        <input type="text" name="inst_short_name" class="sec-input"
               value="{{ settings.inst_short_name }}">
      </div>
    </div>

    <div class="sec-grid-2">
      <div class="sec-field">
        <label class="sec-label">Cabeçalho — Linha 1</label>
        <input type="text" name="header_line_1" class="sec-input"
               value="{{ settings.header_line_1 }}"
               placeholder="Ex: Ministério da Defesa">
      </div>
      <div class="sec-field">
        <label class="sec-label">Cabeçalho — Linha 2</label>
        <input type="text" name="header_line_2" class="sec-input"
               value="{{ settings.header_line_2 }}"
               placeholder="Ex: Exército Brasileiro">
      </div>
    </div>

    <div class="mt-2 text-end">
      <button type="submit" class="btn vis-btn-primary">
        <i class="bi bi-check-lg me-1"></i>Salvar
      </button>
    </div>
  </form>
</div>
