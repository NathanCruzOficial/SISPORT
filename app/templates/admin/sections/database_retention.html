<style>
  .db-sec { font-size: .7rem; color: var(--text-main); }
  .db-sec label { font-size: .64rem; font-weight: 600; margin-bottom: .1rem; }
  .db-sec .form-control,
  .db-sec .form-select { font-size: .66rem; padding: .22rem .45rem; border-radius: 5px; }
  .db-sec .form-check { font-size: .64rem; padding-left: 1.2rem; margin-bottom: .1rem; }
  .db-sec .form-check-input { width: .8rem; height: .8rem; }
  .db-sec .form-check-label { font-size: .63rem; }
  .db-sec .form-text { font-size: .56rem; color: var(--text-muted); }

  .db-summary {
    padding: .3rem .5rem; border-radius: 5px;
    background: var(--olive-100); border: 1px solid rgba(74,93,35,.12);
    font-size: .6rem; color: var(--olive-900); line-height: 1.35;
  }

  .db-sim-row {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .35rem .55rem; border-radius: 5px;
    background: var(--bg-footer); border: 1px solid rgba(0,0,0,.04);
    font-size: .63rem;
  }
  .db-sim-row strong { color: var(--olive-700); font-weight: 700; }

  .db-btn {
    font-size: .62rem; font-weight: 600;
    padding: .22rem .5rem; border-radius: 5px;
    display: inline-flex; align-items: center; gap: .25rem;
    border: none; cursor: pointer;
  }
  .db-btn-olive {
    background: var(--olive-700); border: 1px solid var(--olive-700); color: #fff;
  }
  .db-btn-olive:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }
  .db-btn-outline {
    background: transparent; border: 1px solid rgba(0,0,0,.1); color: var(--text-main);
  }
  .db-btn-outline:hover { border-color: var(--olive-700); color: var(--olive-700); }
  .db-btn-danger {
    background: transparent; border: 1px solid rgba(185,28,28,.2); color: var(--danger);
  }
  .db-btn-danger:hover { background: rgba(185,28,28,.06); border-color: var(--danger); }
</style>

<div class="db-sec">
  <form method="post" action="{{ url_for('admin.save_database') }}" id="retention-form">
    <div class="text-muted mb-2" style="font-size:.6rem;">
      Limpeza pela <strong>última saída</strong> (checkout). <strong>0</strong> = desativado.
      Visitas em aberto não são afetadas.
    </div>

    <div class="row g-2 align-items-start">
      {# Coluna esquerda: dias #}
      <div class="col-12 col-md-4">
        <label for="retention_days">Dias de retenção (0–999)</label>
        <input id="retention_days" name="retention_days" type="number"
               min="0" max="999" step="1" class="form-control"
               value="{{ settings.retention_days }}" required>
        <div class="form-text">Ex.: 30 → após 30 dias sem saída</div>
      </div>

      {# Coluna direita: ação + resumo #}
      <div class="col-12 col-md-8">
        <div style="font-size:.64rem;font-weight:700;margin-bottom:.2rem;">Ação ao expirar</div>
        <div class="d-flex gap-3 flex-wrap align-items-start">
          <label class="form-check mb-0">
            <input class="form-check-input" type="radio" name="retention_action"
                   id="action_delete" value="delete"
                   {% if settings.retention_action == 'delete' %}checked{% endif %}>
            <span class="form-check-label">
              <strong>Apagar</strong>
              <div class="text-muted" style="font-size:.56rem;">Remove dados e foto.</div>
            </span>
          </label>
          <label class="form-check mb-0">
            <input class="form-check-input" type="radio" name="retention_action"
                   id="action_anonymize" value="anonymize"
                   {% if settings.retention_action == 'anonymize' %}checked{% endif %}>
            <span class="form-check-label">
              <strong>Anonimizar</strong>
              <div class="text-muted" style="font-size:.56rem;">Remove dados pessoais.</div>
            </span>
          </label>
          <div id="anonymize_opts"
               style="{% if settings.retention_action != 'anonymize' %}display:none{% endif %}">
            <label class="form-check mb-0">
              <input class="form-check-input" type="checkbox" name="anonymize_delete_photo"
                     id="anonymize_delete_photo" value="1"
                     {% if settings.anonymize_delete_photo %}checked{% endif %}>
              <span class="form-check-label">Apagar foto ao anonimizar</span>
            </label>
          </div>
        </div>

        <div class="db-summary mt-2" id="rule_summary"></div>
      </div>
    </div>

    {# Barra inferior: simulação + botões #}
    <div class="db-sim-row mt-2">
      <span style="font-size:.6rem;color:var(--text-muted);">Afetados agora:</span>
      <strong id="sim_result">—</strong>
      <button class="btn db-btn db-btn-outline" type="button" id="btnRecalc" title="Recalcular">
        <i class="bi bi-arrow-clockwise me-1"></i>Recalcular
      </button>
      <button class="btn db-btn db-btn-danger" type="button" id="btnRunNow">
        <i class="bi bi-trash3 me-1"></i>Executar agora
      </button>
      <div class="ms-auto">
        <button type="submit" class="btn db-btn db-btn-olive">
          <i class="bi bi-check-lg me-1"></i>Salvar
        </button>
      </div>
    </div>
  </form>
</div>

<script>
(function(){
  const days = document.getElementById("retention_days");
  const deleteRadio = document.getElementById("action_delete");
  const anonymRadio = document.getElementById("action_anonymize");
  const anonymOpts = document.getElementById("anonymize_opts");
  const anonymDelPhoto = document.getElementById("anonymize_delete_photo");
  const summary = document.getElementById("rule_summary");
  const simResult = document.getElementById("sim_result");
  const btnRecalc = document.getElementById("btnRecalc");
  const btnRunNow = document.getElementById("btnRunNow");

  function action(){ return anonymRadio.checked ? "anonymize" : "delete"; }

  function updateAnonymizeVisibility(){
    anonymOpts.style.display = anonymRadio.checked ? "block" : "none";
  }

  function updateSummary(){
    const n = parseInt(days.value || "0", 10);
    if (n === 0) {
      summary.innerText = "Retenção automática desativada (0 dias).";
      return;
    }
    summary.innerText =
      `Após ${n} dia(s) sem saída → ` +
      (action() === "delete" ? "apagar definitivamente" : "anonimizar") +
      ". Visitas em aberto não afetadas.";
  }

  async function simulate(){
    const n = parseInt(days.value || "0", 10);
    simResult.innerText = "...";
    try {
      const resp = await fetch("{{ url_for('admin.settings_retention_simulate') }}", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ retention_days: n })
      });
      const data = await resp.json();
      simResult.innerText = resp.ok ? data.count : "erro";
    } catch(e) { simResult.innerText = "erro"; }
  }

  async function runNow(){
    if (!confirm("Executar limpeza agora? Essa ação pode apagar/anonimizar dados.")) return;
    const n = parseInt(days.value || "0", 10);
    const delPhoto = anonymRadio.checked && anonymDelPhoto.checked ? 1 : 0;
    btnRunNow.disabled = true;
    try {
      const resp = await fetch("{{ url_for('admin.settings_retention_run_now') }}", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          retention_days: n,
          action: action(),
          anonymize_delete_photo: delPhoto
        })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Falha");
      alert(`Concluído. Afetados: ${data.affected}`);
      simResult.innerText = data.affected;
    } catch (e) {
      alert(e.message || "Erro");
    } finally {
      btnRunNow.disabled = false;
    }
  }

  days.addEventListener("input", updateSummary);
  deleteRadio.addEventListener("change", () => { updateAnonymizeVisibility(); updateSummary(); });
  anonymRadio.addEventListener("change", () => { updateAnonymizeVisibility(); updateSummary(); });
  btnRecalc.addEventListener("click", simulate);
  btnRunNow.addEventListener("click", runNow);

  updateAnonymizeVisibility();
  updateSummary();
})();
</script>
