<style>
  .db-sec { font-size: .7rem; color: var(--text-main); }
  .db-backup-row {
    display: flex; align-items: center; gap: .65rem;
    padding: .55rem .7rem; border-radius: 7px;
    background: var(--bg-footer); border: 1px solid rgba(0,0,0,.04);
    flex-wrap: wrap;
  }
  .db-backup-icon {
    width: 30px; height: 30px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--olive-100); color: var(--olive-700);
    font-size: .9rem; flex-shrink: 0;
  }
  .db-backup-title { font-size: .7rem; font-weight: 700; color: var(--text-main); line-height: 1.2; }
  .db-backup-desc { font-size: .6rem; color: var(--text-muted); line-height: 1.3; }

  .db-btn {
    font-size: .62rem; font-weight: 600;
    padding: .22rem .5rem; border-radius: 5px;
    display: inline-flex; align-items: center; gap: .25rem;
    border: none; cursor: pointer;
  }
  .db-btn-olive {
    background: var(--olive-700); border: 1px solid var(--olive-700); color: #fff;
  }
  .db-btn-olive:hover { background: var(--olive-900); border-color: var(--olive-900); color: #fff; }

  .db-warn {
    padding: .25rem .5rem; border-radius: 5px;
    font-size: .58rem; background: rgba(180,83,9,.05);
    border: 1px solid rgba(180,83,9,.12); color: #6B5B45;
    display: flex; align-items: center; gap: .3rem;
  }
  .db-warn i { color: #B45309; }
</style>

{% set wip_mode = 'card' %}
{% set wip_text = 'Módulo de relatórios avançados chegando em breve.' %}
{% include 'components/wip.html' %}
