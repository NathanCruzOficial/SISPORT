{# ═══════════════════════════════════════════════════════════════
   Modal de Confirmação Global — Substitui o confirm() nativo
   Uso no base.html:  include 'components/confirm_modal.html'
   ═══════════════════════════════════════════════════════════════ #}
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow" style="border-radius:10px;">

      <div class="modal-body text-center px-4 pt-4 pb-2">
        <div class="mb-2">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle"
               style="width:56px;height:56px;background:rgba(185,28,28,.08);">
            <i class="bi bi-exclamation-triangle-fill" style="color:var(--danger);font-size:1.4rem;"></i>
          </div>
        </div>
        <h6 class="fw-bold mb-1" style="font-size:.85rem;">Confirmar ação</h6>
        <p class="text-muted mb-0" id="confirmModalMsg" style="font-size:.75rem;">Tem certeza?</p>
      </div>

      <div class="modal-footer border-0 justify-content-center gap-2 px-4 pb-4 pt-0">
        <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-sm px-3 text-white" id="confirmModalOk"
                style="background:var(--danger);border-color:var(--danger);">
          <i class="bi bi-check-lg me-1"></i>Confirmar
        </button>
      </div>

    </div>
  </div>
</div>
